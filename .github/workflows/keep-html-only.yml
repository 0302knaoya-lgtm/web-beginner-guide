name: Keep only the HTML guide

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/keep-html-only.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-HTML project files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'index.html' -exec rm -rf {} +
          rm .github/workflows/keep-html-only.yml
          rmdir .github/workflows
          rmdir .github
      - name: Commit HTML-only repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep standalone HTML guide only"
          git push
