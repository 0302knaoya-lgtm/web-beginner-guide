name: Clean macOS metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-macos-files.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove metadata files
        run: |
          find . -type f -name '._*' -delete
          rm .github/workflows/cleanup-macos-files.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove macOS metadata files"
          git push
