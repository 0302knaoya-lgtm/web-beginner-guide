name: Bootstrap repository source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website source
        run: |
          tar -xzf web-beginner-source-slim.tar.gz
          rm web-beginner-source-slim.tar.gz
          rm .github/workflows/bootstrap-source.yml
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add beginner web development guide source"
          git push
